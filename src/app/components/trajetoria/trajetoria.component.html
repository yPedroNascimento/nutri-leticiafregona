<section id="trajetoria" class="trajetoria" aria-labelledby="trajetoria-title">
  <div class="container trajetoria__container">
    <div class="section-header">
      <span class="section-eyebrow">{{ content().trajetoria.eyebrow }}</span>
      <h2 id="trajetoria-title" class="section-title">{{ content().trajetoria.title }}</h2>
      <p class="section-text">{{ content().trajetoria.text }}</p>
    </div>

    <div class="trajetoria__filters" role="group" [attr.aria-label]="content().trajetoria.filterLabel">
      <button
        *ngFor="let category of content().trajetoria.categories"
        type="button"
        class="trajetoria__filter"
        [class.trajetoria__filter--active]="activeCategory() === category.id"
        [attr.aria-pressed]="activeCategory() === category.id"
        (click)="select(category.id)"
      >
        {{ category.label }}
      </button>
    </div>

    <div class="trajetoria__grid">
      <article *ngFor="let item of items()" class="trajetoria__card">
        <div class="trajetoria__meta">
          <span class="trajetoria__tag">{{ categoryLabel(item.category) }}</span>
          <span class="trajetoria__period">{{ item.period }}</span>
        </div>
        <h3 class="trajetoria__card-title">{{ item.title }}</h3>
        <p class="trajetoria__place">{{ item.place }}</p>
        <p class="trajetoria__text">{{ item.description }}</p>
      </article>
    </div>
  </div>
</section>
