<section id="blog" class="blog" aria-labelledby="blog-title">
  <div class="container blog__container">
    <div class="section-header">
      <span class="section-eyebrow">{{ content().blog.eyebrow }}</span>
      <h2 id="blog-title" class="section-title">{{ content().blog.title }}</h2>
    </div>

    <div class="blog__grid">
      <article *ngFor="let article of articles" class="blog__card">
        <img class="blog__image" [src]="article.image" [alt]="article.title" loading="lazy" />
        <div class="blog__body">
          <h3 class="blog__card-title">{{ article.title }}</h3>
          <p class="blog__summary">{{ article.summary }}</p>
          <a class="blog__link" [href]="article.link">{{ content().blog.readMore }}</a>
        </div>
      </article>
    </div>

    <div class="blog__footer">
      <a class="blog__more" href="#">{{ content().blog.moreText }}</a>
    </div>
  </div>
</section>
