<section id="top" class="hero" [attr.aria-label]="content().hero.title">
  <div class="container hero__container">
    <div class="hero__content">
      <!-- <span class="section-eyebrow">{{ content().hero.eyebrow }}</span> -->
      <h1 class="hero__title">{{ content().hero.title }}</h1>
      <p class="hero__subtitle">{{ content().hero.subtitle }}</p>
      <ul class="hero__highlights">
        <li *ngFor="let item of content().hero.highlights">{{ item }}</li>
      </ul>
      <div class="hero__actions">
        <a class="hero__button" href="#cta-final">{{ content().hero.ctaPrimary }}</a>
        <a class="hero__secondary" href="#sobre">{{ content().hero.ctaSecondary }}</a>
      </div>
    </div>
