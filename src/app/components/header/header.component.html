<header class="header">
  <div class="header__container">
    <a class="header__brand" href="#top" (click)="onBrandClick($event)" [attr.aria-label]="'Home - ' + content().header.brand">
      <img class="header__logo" src="/images/logo-fm.png" alt="" width="357" height="176" />
      <span class="header__title">{{ content().header.brand }}</span>
    </a>

    <!-- Inline navigation — desktop only -->
    <nav class="header__nav-inline" aria-label="Main navigation">
      <ul class="header__list-inline">
        <li *ngFor="let item of content().header.navLinks">
          <a class="header__link-inline" [href]="item.href" (click)="onNavLinkClick(item, $event)">{{ item.label }}</a>
        </li>
      </ul>
    </nav>

    <div class="header__actions">
      <a class="header__cta-inline" [href]="whatsappLink" target="_blank" rel="noopener">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
        <span>{{ content().header.cta }}</span>
      </a>

      <!-- Language Selector -->
      <div class="header__lang">
        <button
          class="header__lang-btn"
          type="button"
          aria-label="Change language"
          [attr.aria-expanded]="isLangMenuOpen()"
          aria-haspopup="listbox"
          (click)="toggleLangMenu()"
          (keydown.escape)="closeLangMenu()"
        >
          <span class="header__lang-flag" aria-hidden="true">{{ getCurrentFlag() }}</span>
          <svg class="header__lang-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <ul
          class="header__lang-menu"
          [class.header__lang-menu--open]="isLangMenuOpen()"
          role="listbox"
          aria-label="Select language"
        >
          <li *ngFor="let lang of languages" role="option" [attr.aria-selected]="lang.code === currentLang()">
            <button
              class="header__lang-option"
              [class.header__lang-option--active]="lang.code === currentLang()"
              (click)="selectLanguage(lang.code)"
            >
              <span class="header__lang-option-flag" aria-hidden="true">{{ lang.flag }}</span>
              <span>{{ lang.label }}</span>
            </button>
          </li>
        </ul>
      </div>

      <button
        class="header__toggle"
        type="button"
        aria-label="Menu"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="main-nav"
        (click)="toggleMenu()"
      >
        <svg class="header__icon header__icon--menu" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <svg class="header__icon header__icon--close" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
</header>

<!-- Drawer navigation — mobile/tablet only -->
<!-- Kept outside <header>: backdrop-filter on .header would trap position:fixed descendants -->
<nav id="main-nav" class="header__nav" [class.header__nav--open]="isMenuOpen()" aria-label="Main navigation" [attr.aria-hidden]="!isMenuOpen()">
  <ul class="header__list">
    <li *ngFor="let item of content().header.navLinks" class="header__item">
      <a class="header__link" [href]="item.href" (click)="onNavLinkClick(item, $event)">{{ item.label }}</a>
    </li>
  </ul>

  <a class="header__cta" [href]="whatsappLink" target="_blank" rel="noopener" (click)="closeMenu()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
    </svg>
    {{ content().header.cta }}
  </a>
</nav>

<div class="header__overlay" [class.header__overlay--visible]="isMenuOpen()" (click)="closeMenu()" aria-hidden="true"></div>
<div class="header__lang-backdrop" *ngIf="isLangMenuOpen()" (click)="closeLangMenu()" aria-hidden="true"></div>
